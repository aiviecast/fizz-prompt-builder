[package]
name = "fizz_prompt_builder"
version = "0.2.0"
description = "Fizz brain — assemble LLM messages from persona system prompt + recall + few-shot + history + comment. -> List[Message]"

[dependencies]
fizz_llm_client = { git = "https://github.com/aiviecast/fizz-llm-client", tag = "v0.3.0" }

# Dialect epoch 15 (#4093): a git dependency outside github.com/almide is fetched only
# from an owner the root manifest trusts.
[trust]
owners = ["github.com/aiviecast"]
